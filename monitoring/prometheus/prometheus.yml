global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: archive-nexus-backend
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/nexus-reader-token
    http_headers:
      X-Archive-Source-System:
        values:
          - archive-os
      X-Archive-Service-Scope:
        values:
          - authenticated:read
    static_configs:
      - targets:
          - archive-nexus-backend:8080
